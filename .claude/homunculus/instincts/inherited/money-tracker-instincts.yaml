# Money Tracker Workflow Api Or Shared Schema Change

## Action

Follow the api-or-shared-schema-change workflow:
1. Create or update API route implementation and test files in apps/api/app/api/[feature]/[endpoint]/
2. Update or add service files and their tests in apps/api/lib/[feature]/
3. Update or add shared schema and type definitions in packages/shared/schemas/ and packages/shared/types/
4. If database structure changes, add a new migration in supabase/migrations/
5. Update scripts or configs as needed (e.g., supabase/scripts/gen-types.mjs)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: apps/api/app/api/*/*/route.ts, apps/api/app/api/*/*/route.test.ts, apps/api/lib/*/*.ts

