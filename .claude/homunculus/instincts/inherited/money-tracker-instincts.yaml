# Money Tracker Workflow Add Or Update Ui Component

## Action

Follow the add-or-update-ui-component workflow:
1. Create or update the component implementation file in packages/ui/src/
2. Create or update a corresponding .stories.tsx file for Storybook in packages/ui/src/
3. Create or update a corresponding test file in packages/ui/src/__tests__/
4. Update packages/ui/src/index.ts to export the component

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: packages/ui/src/[component].tsx, packages/ui/src/[component].stories.tsx, packages/ui/src/__tests__/[component].test.tsx

